<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Painel do Caixa: Cadastrar Novo Produto -->
<div class="painel-caixa" style="background: #f0f0f0; padding: 15px; margin-bottom: 20px;">
    <h2>Painel do Caixa - Cadastrar Produto</h2>
    <input type="text" id="novo-nome" placeholder="Nome do prato/bebida">
    <input type="number" id="novo-preco" placeholder="Preço (ex: 25.00)" step="0.01">
    <button onclick="cadastrarProduto()">Cadastrar no Cardápio</button>
</div>

<h1>Nosso Cardápio</h1>

<!-- Lista de Pratos (Agora com ID para o JavaScript gerenciar) -->
<div class="menu" id="container-cardapio">
    <div class="item-cardapio">
        <h3>X-Burguer Especial</h3>
        <p>R$ 25.00</p>
        <button onclick="adicionarAoCarrinho('X-Burguer Especial', 25.00)">Pedir</button>
    </div>
    <div class="item-cardapio">
        <h3>Batata Frita</h3>
        <p>R$ 12.00</p>
        <button onclick="adicionarAoCarrinho('Batata Frita', 12.00)">Pedir</button>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
